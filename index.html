<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regularity Measurement</title>
    <style>
        :root {
            --bg-color: #005a79;
            --text-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #004d66;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 412px;
            min-height: 100vh;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            background-color: var(--bg-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }

        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button svg {
            width: 38px;
            height: 38px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .header-title {
            font-size: 21px;
            font-weight: bold;
            flex-grow: 1;
            text-align: left;
            margin-left: 12px;
        }

        .date-display {
            position: absolute;
            top: 65px;
            right: 24px;
            font-size: 17px;
            font-weight: bold;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 35px;
            flex-grow: 1;
            justify-content: center;
            gap: 16px;
            width: 100%;
        }

        .section-title {
            font-size: 30px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        /* حقل إدخال رقم القطار - كيبورد أرقام فقط */
        .input-field {
            width: 100%;
            padding: 14px;
            font-size: 26px;
            border: none;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #004d66;
            letter-spacing: 6px;
            font-weight: bold;
        }

        .input-field::placeholder {
            color: #8c9ba5;
            font-size: 16px;
            letter-spacing: normal;
            font-weight: normal;
        }

        /* أزرار التسجيل */
        .btn {
            width: 85%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            padding: 16px 0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: #e0f2f1;
        }

        .btn.recorded {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #81c784;
        }

        .btn-submit {
            background-color: #2e7d32;
            color: #ffffff;
            margin-top: 5px;
        }

        .btn-submit:active {
            background-color: #1b5e20;
        }

        .btn-export {
            background-color: #f57c00;
            color: #ffffff;
        }

        .btn-export:active {
            background-color: #e65100;
        }

        .btn-clear {
            background-color: #c62828;
            color: #ffffff;
        }

        .btn-clear:active {
            background-color: #8e0000;
        }

        .counter-badge {
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd54f;
            margin-bottom: 5px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
        }

        .status-msg {
            font-size: 13px;
            color: #ffd54f;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container" id="appCard">
        <!-- Header -->
        <div class="header">
            <button class="back-button" onclick="history.back()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/>
                    <path d="M14 8l-4 4 4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="header-title">Regularity Measurement</div>
        </div>

        <div class="date-display" id="currentDate"></div>

        <!-- Main Content -->
        <div class="content">
            <h1 class="section-title">Train Number</h1>
            
            <div class="counter-badge" id="trainCounter">Saved Trains: 0</div>

            <!-- حقل الأرقام فقط بدون أي تعارض -->
            <input 
                type="text" 
                id="trainNumber" 
                class="input-field" 
                placeholder="Enter Train Number" 
                inputmode="numeric" 
                pattern="[0-9]*"
                maxlength="4"
                autocomplete="off"
            />

            <!-- أزرار تسجيل وكتابة التوقيت بداخلها مباشرة -->
            <button class="btn" id="btnArrival" type="button" onclick="handleArrival()">Train Arrival</button>
            <button class="btn" id="btnDeparture" type="button" onclick="handleDeparture()">Train Departure</button>

            <!-- زر الحفظ وتنزيل لقطة الشاشة -->
            <button class="btn btn-submit" id="btnSubmit" type="button" onclick="saveRecordAndDownloadScreenshot()">📸 💾 Submit & Screenshot</button>
            
            <!-- زر تصدير وتنزيل ملف TXT موحد -->
            <button class="btn btn-export" id="btnExport" type="button" onclick="exportAllToTxt()">📥 Download All (TXT File)</button>
            
            <!-- زر مسح الحقول الحالية -->
            <button class="btn btn-clear" type="button" onclick="resetCurrentForm()">Clear Current Form</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="status-msg" id="statusMessage">Ready to record...</div>
            <div>Ver 79</div>
        </div>
    </div>

    <script>
        // ضبط تاريخ اليوم
        const today = new Date();
        const formattedDate = (today.getMonth() + 1) + '/' + today.getDate() + '/' + today.getFullYear();
        document.getElementById('currentDate').innerText = formattedDate;

        let arrivalTime = "";
        let departureTime = "";
        
        // استرجاع السجلات السابقة من ذاكرة الهاتف
        let savedRecords = [];
        try {
            savedRecords = JSON.parse(localStorage.getItem('train_records') || '[]');
        } catch(e) { savedRecords = []; }
        updateCounter();

        // 1. معالجة كتابة الأرقام فقط وبحد أقصى 4 أرقام
        const inputField = document.getElementById('trainNumber');
        inputField.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
        });

        // 2. دالة حساب التوقيت بنظام 24 ساعة
        function get24HourTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 3. تسجيل وقت الوصول وكتابته داخل الزر
        function handleArrival() {
            arrivalTime = get24HourTime();
            const btn = document.getElementById('btnArrival');
            btn.innerText = "Arrival: " + arrivalTime;
            btn.classList.add('recorded');
            document.getElementById('statusMessage').innerText = "Arrival recorded at " + arrivalTime;
        }

        // 4. تسجيل وقت المغادرة وكتابته داخل الزر
        function handleDeparture() {
            departureTime = get24HourTime();
            const btn = document.getElementById('btnDeparture');
            btn.innerText = "Departure: " + departureTime;
            btn.classList.add('recorded');
            document.getElementById('statusMessage').innerText = "Departure recorded at " + departureTime;
        }

        function updateCounter() {
            document.getElementById('trainCounter').innerText = "Saved Trains: " + savedRecords.length;
        }

        // 5. مسح الحقول للقطار التالي
        function resetCurrentForm() {
            document.getElementById('trainNumber').value = "";
            arrivalTime = "";
            departureTime = "";
            
            const arrBtn = document.getElementById('btnArrival');
            arrBtn.innerText = "Train Arrival";
            arrBtn.classList.remove('recorded');

            const depBtn = document.getElementById('btnDeparture');
            depBtn.innerText = "Train Departure";
            depBtn.classList.remove('recorded');

            document.getElementById('statusMessage').innerText = "Ready for next train.";
        }

        // 6. توليد صورة لقطة الشاشة برمجياً وتنزيلها تلقائياً (Native Canvas Renderer)
        function generateAndDownloadImage(trainNo, dateText, arrText, depText) {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
