<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regularity Measurement</title>
    <style>
        :root {
            --bg-color: #005a79;
            --text-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #004d66;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 412px;
            min-height: 100vh;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            background-color: var(--bg-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            letter-spacing: 0.5px;
        }

        .date-display {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            margin: 5px auto 0 auto;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 35px;
            flex-grow: 1;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .section-title {
            font-size: 30px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        /* Train Number Input - Custom Dialer-pad */
        .input-field {
            width: 100%;
            padding: 14px;
            font-size: 26px;
            border: 2px solid transparent;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #004d66;
            letter-spacing: 6px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .input-field::placeholder {
            color: #8c9ba5;
            font-size: 16px;
            letter-spacing: normal;
            font-weight: normal;
        }

        /* Interactive Buttons */
        .btn {
            width: 90%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 16px 0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
            text-align: center;
            display: block;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: #e0f2f1;
        }

        .btn.recorded {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #81c784;
        }

        /* Error state styling */
        .error-highlight {
            border: 2px solid #ff5252 !important;
            background-color: #ffebee !important;
            color: #c62828 !important;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .btn-submit {
            background-color: #2e7d32;
            color: #ffffff;
            margin-top: 5px;
        }

        .btn-submit:active {
            background-color: #1b5e20;
        }

        .btn-export {
            background-color: #f57c00;
            color: #ffffff;
        }

        .btn-export:active {
            background-color: #e65100;
        }

        .btn-clear {
            background-color: #c62828;
            color: #ffffff;
            font-size: 15px;
            padding: 10px 0;
            width: 60%;
        }

        .counter-badge {
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd54f;
            margin-bottom: 5px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
        }

        .status-msg {
            font-size: 13px;
            color: #ffd54f;
            font-weight: 500;
            min-height: 18px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">Regularity Measurement</div>
        </div>
        <div class="date-display" id="currentDate"></div>

        <!-- Main Content -->
        <div class="content">
            <h1 class="section-title">Train Number</h1>
            
            <div class="counter-badge" id="trainCounter">Saved Trains: 0</div>

            <!-- Train Input field -->
            <input 
                type="tel" 
                id="trainNumber" 
                class="input-field" 
                placeholder="Enter Train Number" 
                maxlength="4" 
                inputmode="numeric" 
                pattern="[0-9]*"
                autocomplete="off"
            />

            <!-- All buttons are fully visible and active -->
            <button class="btn" id="btnArrival" type="button" onclick="handleArrival()">Train Arrival</button>
            <button class="btn" id="btnDeparture" type="button" onclick="handleDeparture()">Train Departure</button>
            <button class="btn btn-submit" id="btnSubmit" type="button" onclick="saveRecord()">💾 Save Train</button>
            <button class="btn btn-export" id="btnExport" type="button" onclick="exportAllToTxt()">📥 Download All (TXT File)</button>
            <button class="btn btn-clear" id="btnClear" type="button" onclick="resetCurrentForm()">Clear Current Form</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="status-msg" id="statusMessage">Enter Train Number & Tap Buttons...</div>
            <div>Ver 79</div>
        </div>
    </div>

    <script>
        const today = new Date();
        const formattedDate = (today.getMonth() + 1) + '/' + today.getDate() + '/' + today.getFullYear();
        document.getElementById('currentDate').innerText = formattedDate;

        let arrivalTime = "";
        let departureTime = "";
        let savedRecords = [];

        try {
            savedRecords = JSON.parse(localStorage.getItem('train_records') || '[]');
        } catch(e) {
            savedRecords = [];
        }

        const inputField = document.getElementById('trainNumber');
        const arrivalBtn = document.getElementById('btnArrival');
        const departureBtn = document.getElementById('btnDeparture');
        const submitBtn = document.getElementById('btnSubmit');
        const exportBtn = document.getElementById('btnExport');
        const clearBtn = document.getElementById('btnClear');

        function updateCounter() {
            document.getElementById('trainCounter').innerText = "Saved Trains: " + savedRecords.length;
        }

        updateCounter();

        // Prevent non-digits and cap at 4 characters
        inputField.addEventListener('input', function() {
            this.classList.remove('error-highlight');
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
            const val = this.value.trim();
            if (val.length > 0) {
                document.getElementById('statusMessage').innerText = "Train " + val + " entered. Tap 'Train Arrival' next.";
            } else {
                document.getElementById('statusMessage').innerText = "Enter Train Number & Tap Buttons...";
            }
        });

        function get24HourTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return h + ':' + m + ':' + s;
        }

        function handleArrival() {
            arrivalTime = get24HourTime();
            arrivalBtn.innerText = "Arrival: " + arrivalTime;
            arrivalBtn.classList.remove('error-highlight');
            arrivalBtn.classList.add('recorded');
            document.getElementById('statusMessage').innerText = `Arrival logged at ${arrivalTime}. Tap 'Train Departure' next.`;
        }

        function handleDeparture() {
            departureTime = get24HourTime();
            departureBtn.innerText = "Departure: " + departureTime;
            departureBtn.classList.remove('error-highlight');
            departureBtn.classList.add('recorded');
            document.getElementById('statusMessage').innerText = "Departure logged at " + departureTime + ". Tap 'Save Train' to save.";
        }

        function resetCurrentForm() {
            inputField.value = "";
            inputField.classList.remove('error-highlight');
            arrivalTime = "";
            departureTime = "";
            
            arrivalBtn.innerText = "Train Arrival";
            arrivalBtn.classList.remove('recorded', 'error-highlight');

            departureBtn.innerText = "Train Departure";
            departureBtn.classList.remove('recorded', 'error-highlight');

            document.getElementById('statusMessage').innerText = "Enter Train Number & Tap Buttons...";
        }

        function saveRecord() {
            const trainNo = inputField.value.trim();

            // 1. Validate Train Number (must be exactly 4 digits)
            if (!trainNo || trainNo.length < 4) {
                inputField.classList.add('error-highlight');
                inputField.focus();
                alert("⚠️ Please enter a complete 4-digit Train Number first!");
                document.getElementById('statusMessage').innerText = "⚠️ Train Number must be 4 digits!";
                return;
            }

            // 2. Validate Train Arrival Time
            if (!arrivalTime) {
                arrivalBtn.classList.add('error-highlight');
                alert("⚠️ Train Arrival time is missing! Please tap 'Train Arrival'.");
                document.getElementById('statusMessage').innerText = "⚠️ Please record Train Arrival time!";
                return;
            }

            // 3. Validate Train Departure Time
            if (!departureTime) {
                departureBtn.classList.add('error-highlight');
                alert("⚠️ Train Departure time is missing! Please tap 'Train Departure'.");
                document.getElementById('statusMessage').innerText = "⚠️ Please record Train Departure time!";
                return;
            }

            // If all fields are fully completed
            const newRecord = {
                date: formattedDate,
                trainNumber: trainNo,
                arrival: arrivalTime,
                departure: departureTime,
                timestamp: get24HourTime()
            };

            savedRecords.push(newRecord);
            try {
                localStorage.setItem('train_records', JSON.stringify(savedRecords));
            } catch(e) {}
            
            updateCounter();
            alert("✅ Train " + trainNo + " saved successfully! Total saved: " + savedRecords.length);
            resetCurrentForm();
        }

        function exportAllToTxt() {
            if (savedRecords.length === 0) {
                alert("⚠️ No saved trains to download yet!");
                return;
            }

            // Clean, pure linebreaks for text reports
            let fileContent = "========================================\\n";
            fileContent += "      REGULARITY MEASUREMENT REPORT      \\n";
            fileContent += "      Date: " + formattedDate + " | Total Trains: " + savedRecords.length + "\\n";
            fileContent += "========================================\\n\\n";
            fileContent += "Date       | Train No | Arrival  | Departure\\n";
            fileContent += "----------------------------------------\\n";

            savedRecords.forEach(function(item) {
                const dateFormatted = item.date.padEnd(10, ' ');
                const trainFormatted = item.trainNumber.padEnd(8, ' ');
                const arrFormatted = item.arrival.padEnd(8, ' ');
                const depFormatted = item.departure.padEnd(8, ' ');
                fileContent += dateFormatted + " | " + trainFormatted + " | " + arrFormatted + " | " + depFormatted + "\\n";
            });

            fileContent += "\\n========================================\\n";

            // Unescape newline characters
            const cleanContent = fileContent.replace(/\\\\n/g, '\\n');

            try {
                const blob = new Blob([cleanContent], { type: "text/plain;charset=utf-8" });
                
                if (window.navigator && window.navigator.msSaveOrOpenBlob) {
                    window.navigator.msSaveOrOpenBlob(blob, "Regularity_Report.txt");
                    return;
                }

                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                const fileName = "Regularity_" + formattedDate.replace(/\\//g, '-') + "_AllTrains.txt";
                
                link.href = url;
                link.download = fileName;
                link.target = "_blank";
                
                document.body.appendChild(link);
                link.click();
                
                setTimeout(function() {
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }, 100);

                setTimeout(function() {
                    if (confirm("✅ TXT report downloaded successfully!\\n\\nDo you want to clear the saved list to start fresh?")) {
                        savedRecords = [];
                        localStorage.removeItem('train_records');
                        updateCounter();
                        resetCurrentForm();
                    }
                }, 500);

            } catch (err) {
                console.error(err);
                alert("❌ Download block encountered. Copying report instead:\\n\\n" + cleanContent);
            }
        }
    </script>
</body>
</html>
