<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regularity Measurement</title>
    <style>
        :root {
            --bg-color: #005a79;
            --text-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #004d66;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 412px;
            min-height: 100vh;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            background-color: var(--bg-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }

        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button svg {
            width: 38px;
            height: 38px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .header-title {
            font-size: 21px;
            font-weight: bold;
            flex-grow: 1;
            text-align: left;
            margin-left: 12px;
        }

        .date-display {
            position: absolute;
            top: 65px;
            right: 24px;
            font-size: 17px;
            font-weight: bold;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 35px;
            flex-grow: 1;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .section-title {
            font-size: 30px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        /* Train Number Input - Custom Dialer-pad */
        .input-field {
            width: 100%;
            padding: 14px;
            font-size: 26px;
            border: none;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #004d66;
            letter-spacing: 6px;
            font-weight: bold;
        }

        .input-field::placeholder {
            color: #8c9ba5;
            font-size: 16px;
            letter-spacing: normal;
            font-weight: normal;
        }

        /* Interactive Buttons */
        .btn {
            width: 90%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            padding: 16px 0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
            text-align: center;
            display: block;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: #e0f2f1;
        }

        .btn.recorded {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #81c784;
        }

        .btn-submit {
            background-color: #2e7d32;
            color: #ffffff;
            margin-top: 5px;
        }

        .btn-submit:active {
            background-color: #1b5e20;
        }

        .btn-export {
            background-color: #f57c00;
            color: #ffffff;
        }

        .btn-export:active {
            background-color: #e65100;
        }

        .btn-clear {
            background-color: #c62828;
            color: #ffffff;
            font-size: 15px;
            padding: 10px 0;
            width: 60%;
        }

        .counter-badge {
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd54f;
            margin-bottom: 5px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
        }

        .status-msg {
            font-size: 13px;
            color: #ffd54f;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="back-button" onclick="history.back()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/>
                    <path d="M14 8l-4 4 4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="header-title">Regularity Measurement</div>
        </div>

        <div class="date-display" id="currentDate"></div>

        <!-- Main Content -->
        <div class="content">
            <h1 class="section-title">Train Number</h1>
            
            <div class="counter-badge" id="trainCounter">Saved Trains: 0</div>

            <!-- Train Input field -->
            <input 
                type="tel" 
                id="trainNumber" 
                class="input-field" 
                placeholder="Enter Train Number" 
                maxlength="4" 
                inputmode="numeric" 
                pattern="[0-9]*"
                autocomplete="off"
            />

            <!-- Always visible buttons to prevent rendering issues -->
            <button class="btn" id="btnArrival" type="button" onclick="handleArrival()">Train Arrival</button>
            <button class="btn" id="btnDeparture" type="button" onclick="handleDeparture()">Train Departure</button>
            <button class="btn btn-submit" id="btnSubmit" type="button" onclick="saveRecord()">💾 Save Train</button>
            <button class="btn btn-export" id="btnExport" type="button" onclick="exportAllToTxt()">📥 Download All (TXT File)</button>
            <button class="btn btn-clear" id="btnClear" type="button" onclick="resetCurrentForm()">Clear Current Form</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="status-msg" id="statusMessage">Enter Train Number & Tap Buttons...</div>
            <div>Ver 79</div>
        </div>
    </div>

    <script>
        const today = new Date();
        const formattedDate = (today.getMonth() + 1) + '/' + today.getDate() + '/' + today.getFullYear();
        document.getElementById('currentDate').innerText = formattedDate;

        let arrivalTime = "";
        let departureTime = "";
        
        let savedRecords = [];
        try {
            savedRecords = JSON.parse(localStorage.getItem('train_records') || '[]');
        } catch(e) { savedRecords = []; }
        updateCounter();

        const inputField = document.getElementById('trainNumber');
        const arrivalBtn = document.getElementById('btnArrival');
        const departureBtn = document.getElementById('btnDeparture');
        const submitBtn = document.getElementById('btnSubmit');
        const exportBtn = document.getElementById('btnExport');
        const clearBtn = document.getElementById('btnClear');

        // Prevent non-digits and limit to 4 characters
        inputField.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
            const val = this.value.trim();
            if (val.length > 0) {
                document.getElementById('statusMessage').innerText = `Train ${val} entered. Tap 'Train Arrival' next.`;
            } else {
                document.getElementById('statusMessage').innerText = "Enter Train Number & Tap Buttons...";
            }
        });

        // 24-Hour time
        function get24HourTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return h + ':' + m + ':' + s;
        }

        function handleArrival() {
            arrivalTime = get24HourTime();
            arrivalBtn.innerText = "Arrival: " + arrivalTime;
            arrivalBtn.classList.add('recorded');
            document.getElementById('statusMessage').innerText = `Arrival logged at ${arrivalTime}. Tap 'Train Departure' next.`;
        }

        function handleDeparture() {
            departureTime = get24HourTime();
            departureBtn.innerText = "Departure: " + departureTime;
            departureBtn.classList.add('recorded');
            document.getElementById('statusMessage').innerText = `Departure logged at ${departureTime}. Tap 'Save Train' to save.`;
        }

        function updateCounter() {
            document.getElementById('trainCounter').innerText = "Saved Trains: " + savedRecords.length;
        }

        function resetCurrentForm() {
            inputField.value = "";
            arrivalTime = "";
            departureTime = "";
            
            arrivalBtn.innerText = "Train Arrival";
            arrivalBtn.classList.remove('recorded');

            departureBtn.innerText = "Train Departure";
            departureBtn.classList.remove('recorded');

            document.getElementById('statusMessage').innerText = "Enter Train Number & Tap Buttons...";
        }

        function saveRecord() {
            const trainNo = inputField.value.trim();

            if (!trainNo) {
                alert("⚠️ Please enter a Train Number first!");
                return;
            }
            if (!arrivalTime && !departureTime) {
                alert("⚠️ Please record Arrival or Departure time before saving!");
                return;
            }

            const newRecord = {
                date: formattedDate,
                trainNumber: trainNo,
                arrival: arrivalTime || "N/A",
                departure: departureTime || "N/A",
                timestamp: get24HourTime()
            };

            savedRecords.push(newRecord);
            try {
                localStorage.setItem('train_records', JSON.stringify(savedRecords));
            } catch(e) {}
            
            updateCounter();
            alert("✅ Train " + trainNo + " saved locally! Total saved: " + savedRecords.length);
            resetCurrentForm();
        }

        // Multi-browser compatible file download (handles iOS Safari and Android Chrome sandbox blocks)
        function exportAllToTxt() {
            if (savedRecords.length === 0) {
                alert("⚠️ No saved trains to download yet!");
                return;
            }

            let fileContent = "========================================\n";
            fileContent += "      REGULARITY MEASUREMENT REPORT      \n";
            fileContent += "      Date: " + formattedDate + " | Total Trains: " + savedRecords.length + "\n";
            fileContent += "========================================\n\n";
            fileContent += "Train No | Date       | Arrival  | Departure\n";
            fileContent += "----------------------------------------\n";

            savedRecords.forEach(function(item) {
                const trainFormatted = item.trainNumber.padEnd(8, ' ');
                const dateFormatted = item.date.padEnd(10, ' ');
                const arrFormatted = item.arrival.padEnd(8, ' ');
                const depFormatted = item.departure.padEnd(8, ' ');
                fileContent += trainFormatted + " | " + dateFormatted + " | " + arrFormatted + " | " + depFormatted + "\n";
            });

            fileContent += "\n========================================\n";

            try {
                const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
                
                // Fallback for Internet Explorer
                if (window.navigator && window.navigator.msSaveOrOpenBlob) {
                    window.navigator.msSaveOrOpenBlob(blob, "Regularity_Report.txt");
                    return;
                }

                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                const fileName = "Regularity_" + formattedDate.replace(/\//g, '-') + "_AllTrains.txt";
                
                link.href = url;
                link.download = fileName;
                link.target = "_blank"; // Crucial parameter to force open download dialog in iOS Safari & Chrome WebViews
                
                document.body.appendChild(link);
                link.click();
                
                // Keep the link for a split second before removing to ensure trigger succeeds
                setTimeout(function() {
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }, 100);

                setTimeout(function() {
                    if (confirm("✅ TXT report downloaded successfully!\n\nDo you want to clear the saved list to start fresh?")) {
                        savedRecords = [];
                        localStorage.removeItem('train_records');
                        updateCounter();
                        resetCurrentForm();
                    }
                }, 500);

            } catch (err) {
                console.error(err);
                alert("❌ Download block encountered. Copying report instead:\n\n" + fileContent);
            }
        }
    </script>
</body>
</html>
