<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regularity Measurement</title>
    <!-- html2canvas library for capturing screenshots -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #005a79;
            --text-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #004d66;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 412px;
            min-height: 100vh;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            background-color: var(--bg-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }

        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button svg {
            width: 38px;
            height: 38px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .header-title {
            font-size: 21px;
            font-weight: bold;
            flex-grow: 1;
            text-align: left;
            margin-left: 12px;
        }

        .date-display {
            position: absolute;
            top: 65px;
            right: 24px;
            font-size: 17px;
            font-weight: bold;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 35px;
            flex-grow: 1;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .section-title {
            font-size: 30px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        /* Train Number Input - Custom Dialer-pad */
        .input-field {
            width: 100%;
            padding: 14px;
            font-size: 26px;
            border: none;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #004d66;
            letter-spacing: 6px;
            font-weight: bold;
            -moz-appearance: textfield;
        }

        .input-field::-webkit-outer-spin-button,
        .input-field::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-field::placeholder {
            color: #8c9ba5;
            font-size: 16px;
            letter-spacing: normal;
            font-weight: normal;
        }

        /* Interactive Buttons */
        .btn {
            width: 90%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            padding: 16px 0;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            text-align: center;
            display: none; /* Hidden by default, shown sequentially */
            opacity: 0;
        }

        .btn.visible {
            display: block;
            opacity: 1;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: #e0f2f1;
        }

        .btn.recorded {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #81c784;
        }

        .btn-submit {
            background-color: #2e7d32;
            color: #ffffff;
            margin-top: 5px;
        }

        .btn-submit:active {
            background-color: #1b5e20;
        }

        .btn-export {
            background-color: #f57c00;
            color: #ffffff;
        }

        .btn-export:active {
            background-color: #e65100;
        }

        .btn-clear {
            background-color: #c62828;
            color: #ffffff;
            font-size: 15px;
            padding: 10px 0;
            width: 60%;
        }

        .counter-badge {
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd54f;
            margin-bottom: 5px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
        }

        .status-msg {
            font-size: 13px;
            color: #ffd54f;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container" id="appCard">
        <!-- Header -->
        <div class="header">
            <button class="back-button" onclick="history.back()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/>
                    <path d="M14 8l-4 4 4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="header-title">Regularity Measurement</div>
        </div>

        <div class="date-display" id="currentDate"></div>

        <!-- Main Content -->
        <div class="content">
            <h1 class="section-title">Train Number</h1>
            
            <div class="counter-badge" id="trainCounter">Saved Trains: 0</div>

            <!-- Train Input field -->
            <input 
                type="tel" 
                id="trainNumber" 
                class="input-field" 
                placeholder="Enter Train Number" 
                maxlength="4" 
                inputmode="numeric" 
                pattern="[0-9]*"
                autocomplete="off"
            />

            <!-- Steps buttons -->
            <button class="btn" id="btnArrival" type="button" onclick="handleArrival()">Train Arrival</button>
            <button class="btn" id="btnDeparture" type="button" onclick="handleDeparture()">Train Departure</button>
            <button class="btn btn-submit" id="btnSubmit" type="button" onclick="saveRecordAndDownloadScreenshot()">📸 💾 Submit & Screenshot</button>
            <button class="btn btn-export" id="btnExport" type="button" onclick="exportAllToTxt()">📥 Download All (TXT File)</button>
            <button class="btn btn-clear" id="btnClear" type="button" onclick="resetCurrentForm()">Clear Current Form</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="status-msg" id="statusMessage">Enter 4-digit Train Number to start...</div>
            <div>Ver 79</div>
        </div>
    </div>

    <script>
        const today = new Date();
        const formattedDate = (today.getMonth() + 1) + '/' + today.getDate() + '/' + today.getFullYear();
        document.getElementById('currentDate').innerText = formattedDate;

        let arrivalTime = "";
        let departureTime = "";
        
        let savedRecords = [];
        try {
            savedRecords = JSON.parse(localStorage.getItem('train_records') || '[]');
        } catch(e) { savedRecords = []; }
        updateCounter();

        const inputField = document.getElementById('trainNumber');
        const arrivalBtn = document.getElementById('btnArrival');
        const departureBtn = document.getElementById('btnDeparture');
        const submitBtn = document.getElementById('btnSubmit');
        const exportBtn = document.getElementById('btnExport');
        const clearBtn = document.getElementById('btnClear');

        if (savedRecords.length > 0) {
            exportBtn.classList.add('visible');
        }

        // Real-time input checking to reveal the 'Train Arrival' button immediately upon typing 4 digits (e.g. 7071)
        inputField.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
            const val = this.value.trim();

            if (val.length === 4) {
                arrivalBtn.classList.add('visible');
                clearBtn.classList.add('visible');
                inputField.blur(); // dismiss mobile keyboard automatically
                document.getElementById('statusMessage').innerText = `Train ${val} set. Tap 'Train Arrival' next.`;
            } else {
                arrivalBtn.classList.remove('visible');
                departureBtn.classList.remove('visible');
                submitBtn.classList.remove('visible');
                clearBtn.classList.remove('visible');
                document.getElementById('statusMessage').innerText = "Please enter 4 digits.";
            }
        });

        function get24HourTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function handleArrival() {
            arrivalTime = get24HourTime();
            arrivalBtn.innerText = "Arrival: " + arrivalTime;
            arrivalBtn.classList.add('recorded');
            departureBtn.classList.add('visible');
            document.getElementById('statusMessage').innerText = `Arrival logged at ${arrivalTime}. Tap 'Train Departure' next.`;
        }

        function handleDeparture() {
            departureTime = get24HourTime();
            departureBtn.innerText = "Departure: " + departureTime;
            departureBtn.classList.add('recorded');
            submitBtn.classList.add('visible');
            document.getElementById('statusMessage').innerText = `Departure logged at ${departureTime}. Tap 'Submit & Screenshot' to save.`;
        }

        function updateCounter() {
            document.getElementById('trainCounter').innerText = "Saved Trains: " + savedRecords.length;
        }

        function resetCurrentForm() {
            inputField.value = "";
            inputField.disabled = false;
            arrivalTime = "";
            departureTime = "";
            
            arrivalBtn.innerText = "Train Arrival";
            arrivalBtn.classList.remove('recorded');
            arrivalBtn.classList.remove('visible');

            departureBtn.innerText = "Train Departure";
            departureBtn.classList.remove('recorded');
            departureBtn.classList.remove('visible');

            submitBtn.classList.remove('visible');
            clearBtn.classList.remove('visible');

            if (savedRecords.length > 0) {
                exportBtn.classList.add('visible');
            } else {
                exportBtn.classList.remove('visible');
            }

            document.getElementById('statusMessage').innerText = "Enter train number to start...";
        }

        function generateAndDownloadImage(trainNo, dateText, arrText, depText) {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 900;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#005a79';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Regularity Measurement', 50, 80);

            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(dateText, canvas.width - 50, 80);

            ctx.textAlign = 'center';
            ctx.font = 'bold 44px sans-serif';
            ctx.fillText('Train Number', canvas.width / 2, 230);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(80, 260, 440, 90, [10]);
            ctx.fill();

            ctx.fillStyle = '#004d66';
            ctx.font = 'bold 50px sans-serif';
            ctx.fillText(trainNo, canvas.width / 2, 325);

            ctx.fillStyle = arrText ? '#e8f5e9' : '#ffffff';
            ctx.beginPath();
            ctx.roundRect(80, 390, 440, 90, [10]);
            ctx.fill();
            if (arrText) {
                ctx.strokeStyle = '#81c784';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            ctx.fillStyle = arrText ? '#1b5e20' : '#004d66';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText(arrText ? 'Arrival: ' + arrText : 'Train Arrival', canvas.width / 2, 448);

            ctx.fillStyle = depText ? '#e8f5e9' : '#ffffff';
            ctx.beginPath();
            ctx.roundRect(80, 520, 440, 90, [10]);
            ctx.fill();
            if (depText) {
                ctx.strokeStyle = '#81c784';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            ctx.fillStyle = depText ? '#1b5e20' : '#004d66';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText(depText ? 'Departure: ' + depText : 'Train Departure', canvas.width / 2, 578);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = '22px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Saved Record', 50, 840);
            ctx.textAlign = 'right';
            ctx.fillText('Ver 79', canvas.width - 50, 840);

            const link = document.createElement('a');
            const timeTag = get24HourTime().replace(/:/g, '-');
            link.download = `Train_${trainNo}_${timeTag}.png`;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function saveRecordAndDownloadScreenshot() {
            const trainNo = inputField.value.trim();

            if (!trainNo || trainNo.length < 4) {
                alert("⚠️ Please enter a valid 4-digit Train Number first!");
                return;
            }

            generateAndDownloadImage(trainNo, formattedDate, arrivalTime, departureTime);

            const newRecord = {
                date: formattedDate,
                trainNumber: trainNo,
                arrival: arrivalTime || "N/A",
                departure: departureTime || "N/A",
                timestamp: get24HourTime()
            };

            savedRecords.push(newRecord);
            try {
                localStorage.setItem('train_records', JSON.stringify(savedRecords));
            } catch(e) {}
            
            updateCounter();
            alert(`✅ Train ${trainNo} saved & Screenshot downloaded! Total saved: ${savedRecords.length}`);
            resetCurrentForm();
        }

        function exportAllToTxt() {
            if (savedRecords.length === 0) {
                alert("⚠️ No saved trains to download yet!");
                return;
            }

            let fileContent = "========================================\\n";
            fileContent += "      REGULARITY MEASUREMENT REPORT      \\n";
            fileContent += `      Date: ${formattedDate} | Total Trains: ${savedRecords.length}\\n`;
            fileContent += "========================================\\n\\n";
            fileContent += "Train No | Date       | Arrival  | Departure\\n";
            fileContent += "----------------------------------------\\n";

            savedRecords.forEach((item) => {
