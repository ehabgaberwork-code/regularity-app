<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regularity Measurement</title>
    <style>
        :root {
            --bg-color: #005a79;
            --text-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #004d66;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 412px;
            min-height: 100vh;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            background-color: var(--bg-color);
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 5px;
            width: 100%;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .date-display {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            flex-grow: 1;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        /* Input fields */
        .input-field {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            border: 2px solid transparent;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #004d66;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .input-field.train-no {
            font-size: 26px;
            letter-spacing: 6px;
        }

        .input-field::placeholder {
            color: #8c9ba5;
            font-size: 15px;
            letter-spacing: normal;
            font-weight: normal;
        }

        /* Interactive Buttons */
        .btn {
            width: 90%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 15px 0;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
            text-align: center;
            display: block;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: #e0f2f1;
        }

        .btn.recorded {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #81c784;
        }

        /* Error state styling */
        .error-highlight {
            border: 2px solid #ff5252 !important;
            background-color: #ffebee !important;
            color: #c62828 !important;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .btn-submit {
            background-color: #2e7d32;
            color: #ffffff;
            margin-top: 3px;
        }

        .btn-submit:active {
            background-color: #1b5e20;
        }

        .btn-export {
            background-color: #f57c00;
            color: #ffffff;
        }

        .btn-export:active {
            background-color: #e65100;
        }

        .btn-clear {
            background-color: #c62828;
            color: #ffffff;
            font-size: 14px;
            padding: 8px 0;
            width: 50%;
        }

        .counter-badge {
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #ffd54f;
            margin-bottom: 2px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 10px;
        }

        .status-msg {
            font-size: 13px;
            color: #ffd54f;
            font-weight: 500;
            min-height: 18px;
            text-align: left;
        }

        /* Modal fallback for preview/copy */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card {
            background: #ffffff;
            color: #333333;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-card textarea {
            width: 100%;
            height: 180px;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            resize: none;
        }

        .modal-btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .modal-btn.copy {
            background-color: #005a79;
            color: #ffffff;
        }

        .modal-btn.close {
            background-color: #e0e0e0;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">Regularity Measurement</div>
            <div class="date-display" id="currentDate"></div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- حقل اسم المستخدم -->
            <input 
                type="text" 
                id="userName" 
                class="input-field" 
                placeholder="👤 Enter User Name" 
                autocomplete="name"
            />

            <!-- حقل رقم القطار -->
            <input 
                type="tel" 
                id="trainNumber" 
                class="input-field train-no" 
                placeholder="🚆 Train Number (4 digits)" 
                maxlength="4" 
                inputmode="numeric" 
                pattern="[0-9]*" 
                autocomplete="off"
            />

            <div class="counter-badge" id="trainCounter">Saved Trains: 0</div>

            <!-- أزرار التسجيل -->
            <button class="btn" id="btnArrival" type="button" onclick="handleArrival()">Train Arrival</button>
            <button class="btn" id="btnDeparture" type="button" onclick="handleDeparture()">Train Departure</button>
            <button class="btn btn-submit" id="btnSubmit" type="button" onclick="saveRecord()">💾 Save Train</button>
            <button class="btn btn-export" id="btnExport" type="button" onclick="exportAllToTxt()">📥 Download / Share All (TXT)</button>
            <button class="btn btn-clear" id="btnClear" type="button" onclick="resetCurrentForm()">Clear Form</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="status-msg" id="statusMessage">Enter details & tap buttons...</div>
            <div>Ver 80</div>
        </div>
    </div>

    <!-- نافذة منبثقة احتياطية للنسخ المباشر -->
    <div class="modal-overlay" id="reportModal">
        <div class="modal-card">
            <h3 style="margin:0; text-align:center; color:#005a79;">📄 TXT Report Ready</h3>
            <textarea id="reportTextArea" readonly></textarea>
            <button class="modal-btn copy" onclick="copyReportText()">📋 Copy All Text</button>
            <button class="modal-btn close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        // ضبط تاريخ اليوم
        const today = new Date();
        const formattedDate = (today.getMonth() + 1) + '/' + today.getDate() + '/' + today.getFullYear();
        document.getElementById('currentDate').innerText = formattedDate;

        let arrivalTime = "";
        let departureTime = "";
        let savedRecords = [];

        // استرجاع السجلات السابقة
        try {
            savedRecords = JSON.parse(localStorage.getItem('train_records') || '[]');
        } catch(e) {
            savedRecords = [];
        }

        const userInput = document.getElementById('userName');
        const trainInput = document.getElementById('trainNumber');
        const arrivalBtn = document.getElementById('btnArrival');
        const departureBtn = document.getElementById('btnDeparture');

        // استرجاع اسم المستخدم المحفوظ تلقائياً
        const savedUserName = localStorage.getItem('user_name') || '';
        if (savedUserName) {
            userInput.value = savedUserName;
        }

        userInput.addEventListener('input', function() {
            this.classList.remove('error-highlight');
            localStorage.setItem('user_name', this.value.trim());
        });

        function updateCounter() {
            document.getElementById('trainCounter').innerText = "Saved Trains: " + savedRecords.length;
        }

        updateCounter();

        // إدخال أرقام فقط لرقم القطار
        trainInput.addEventListener('input', function() {
            this.classList.remove('error-highlight');
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
            const val = this.value.trim();
            if (val.length > 0) {
                document.getElementById('statusMessage').innerText = `Train ${val} entered. Tap 'Train Arrival' next.`;
            } else {
                document.getElementById('statusMessage').innerText = "Enter details & tap buttons...";
            }
        });

        // صيغة 24 ساعة
        function get24HourTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return h + ':' + m + ':' + s;
        }

        // تسجيل وقت الوصول
        function handleArrival() {
            arrivalTime = get24HourTime();
            arrivalBtn.innerText = "Arrival: " + arrivalTime;
            arrivalBtn.classList.remove('error-highlight');
            arrivalBtn.classList.add('recorded');
            document.getElementById('statusMessage').innerText = `Arrival logged at ${arrivalTime}. Tap 'Train Departure' next.`;
        }

        // تسجيل وقت المغادرة
        function handleDeparture() {
            departureTime = get24HourTime();
            departureBtn.innerText = "Departure: " + departureTime;
            departureBtn.classList.remove('error-highlight');
            departureBtn.classList.add('recorded');
            document.getElementById('statusMessage').innerText = `Departure logged at ${departureTime}. Tap 'Save Train' to save.`;
        }

        // مسح الحقول للقطار التالي
        function resetCurrentForm() {
            trainInput.value = "";
            trainInput.classList.remove('error-highlight');
            arrivalTime = "";
            departureTime = "";
            
            arrivalBtn.innerText = "Train Arrival";
            arrivalBtn.classList.remove('recorded', 'error-highlight');

            departureBtn.innerText = "Train Departure";
            departureBtn.classList.remove('recorded', 'error-highlight');

            document.getElementById('statusMessage').innerText = "Enter Train Number & Tap Buttons...";
        }

        // حفظ القطار مع التحقق من جميع الحقول
        function saveRecord() {
            const user = userInput.value.trim();
            const trainNo = trainInput.value.trim();

            if (!user) {
                userInput.classList.add('error-highlight');
                userInput.focus();
                alert("⚠️ Please enter User Name first!");
                document.getElementById('statusMessage').innerText = "⚠️ User Name is required!";
                return;
            }

            if (!trainNo || trainNo.length < 4) {
                trainInput.classList.add('error-highlight');
                trainInput.focus();
                alert("⚠️ Please enter a complete 4-digit Train Number!");
                document.getElementById('statusMessage').innerText = "⚠️ Train Number must be 4 digits!";
                return;
            }

            if (!arrivalTime) {
                arrivalBtn.classList.add('error-highlight');
                alert("⚠️ Train Arrival time is missing! Please tap 'Train Arrival'.");
                document.getElementById('statusMessage').innerText = "⚠️ Please record Train Arrival time!";
                return;
            }

            if (!departureTime) {
                departureBtn.classList.add('error-highlight');
                alert("⚠️ Train Departure time is missing! Please tap 'Train Departure'.");
                document.getElementById('statusMessage').innerText = "⚠️ Please record Train Departure time!";
                return;
            }

            const newRecord = {
                user: user,
                date: formattedDate,
                trainNumber: trainNo,
                arrival: arrivalTime,
                departure: departureTime,
                timestamp: get24HourTime()
            };

            savedRecords.push(newRecord);
            try {
                localStorage.setItem('train_records', JSON.stringify(savedRecords));
            } catch(e) {}
            
            updateCounter();
            alert("✅ Train " + trainNo + " saved successfully! Total saved: " + savedRecords.length);
            resetCurrentForm();
        }

        // بناء نص التقرير بأسطر نظيفة
        function buildReportText() {
            const user = userInput.value.trim() || (savedRecords[0] ? savedRecords[0].user : "Operator");
            let txt = "========================================\n";
            txt += "      REGULARITY MEASUREMENT REPORT      \n";
            txt += "      Inspector / User: " + user + "\n";
            txt += "      Date: " + formattedDate + " | Total Trains: " + savedRecords.length + "\n";
            txt += "========================================\n\n";
            txt += "Date       | Train No | Arrival  | Departure\n";
            txt += "----------------------------------------\n";

            savedRecords.forEach(function(item) {
                const d = item.date.padEnd(10, ' ');
                const t = item.trainNumber.padEnd(8, ' ');
                const a = item.arrival.padEnd(8, ' ');
                const dep = item.departure.padEnd(8, ' ');
                txt += d + " | " + t + " | " + a + " | " + dep + "\n";
            });

            txt += "\n========================================\n";
            return txt;
        }

        // تنزيل ومشاركة الملف بأمان تام على كل الهواتف
        async function exportAllToTxt() {
            if (savedRecords.length === 0) {
                alert("⚠️ No saved trains to download yet! Please save at least one train.");
                return;
            }

            const reportText = buildReportText();
            const fileName = "Regularity_" + formattedDate.replace(/\//g, '-') + "_Report.txt";

            // 1. استخدام خاصية المشاركة المباشرة للهواتف (Save to Files / Share)
            if (navigator.canShare && navigator.share) {
                try {
                    const file = new File([reportText], fileName, { type: "text/plain" });
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: "Regularity Report",
                            text: "Regularity Report for " + formattedDate
                        });
                        promptReset();
                        return;
                    }
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }

            // 2. تنزيل مباشر عبر Data URI المتوافق
            try {
                const encodedData = "data:text/plain;charset=utf-8," + encodeURIComponent(reportText);
                const link = document.createElement("a");
                link.setAttribute("href", encodedData);
                link.setAttribute("download", fileName);
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                promptReset();
                return;
            } catch (err) {
                console.error("Download error:", err);
            }

            // 3. النافذة الاحتياطية لعرض ونسخ النص فوراً
            document.getElementById('reportTextArea').value = reportText;
            document.getElementById('reportModal').style.display = 'flex';
        }

        function copyReportText() {
            const ta = document.getElementById('reportTextArea');
            ta.select();
            ta.setSelectionRange(0, 99999);
            document.execCommand('copy');
            alert("📋 Report text copied to clipboard successfully!");
        }

        function closeModal() {
            document.getElementById('reportModal').style.display = 'none';
            promptReset();
        }

        function promptReset() {
            setTimeout(function() {
                if (confirm("✅ Report exported!\n\nDo you want to clear the saved list to start a new shift?")) {
                    savedRecords = [];
                    localStorage.removeItem('train_records');
                    updateCounter();
                    resetCurrentForm();
                }
            }, 500);
        }
    </script>
</body>
</html>
