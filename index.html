<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regularity Measurement</title>
    <style>
        :root {
            --bg-color: #005a79;
            --text-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #004d66;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 412px;
            min-height: 100vh;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            background-color: var(--bg-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }

        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button svg {
            width: 38px;
            height: 38px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .header-title {
            font-size: 21px;
            font-weight: bold;
            flex-grow: 1;
            text-align: left;
            margin-left: 12px;
        }

        .date-display {
            position: absolute;
            top: 65px;
            right: 24px;
            font-size: 17px;
            font-weight: bold;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            flex-grow: 1;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .section-title {
            font-size: 30px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        /* حقل إدخال رقم القطار */
        .input-field {
            width: 100%;
            padding: 14px;
            font-size: 26px;
            border: none;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #004d66;
            letter-spacing: 6px;
            font-weight: bold;
        }

        .input-field::placeholder {
            color: #8c9ba5;
            font-size: 16px;
            letter-spacing: normal;
            font-weight: normal;
        }

        /* الأزرار التفاعلية */
        .btn {
            width: 90%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            padding: 16px 0;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            text-align: center;
            display: none; /* مخفي افتراضياً ويظهر خطوة بخطوة */
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn:active {
            transform: scale(0.97);
            background-color: #e0f2f1;
        }

        .btn.recorded {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #81c784;
        }

        /* زر الحفظ وتنزيل الصورة */
        .btn-submit {
            background-color: #2e7d32;
            color: #ffffff;
        }

        .btn-submit:active {
            background-color: #1b5e20;
        }

        /* زر تصدير الملف النصي */
        .btn-export {
            background-color: #f57c00;
            color: #ffffff;
        }

        .btn-export:active {
            background-color: #e65100;
        }

        .btn-clear {
            background-color: #c62828;
            color: #ffffff;
            font-size: 15px;
            padding: 10px 0;
            width: 60%;
        }

        .counter-badge {
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd54f;
            margin-bottom: 5px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
        }

        .status-msg {
            font-size: 13px;
            color: #ffd54f;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container" id="appCard">
        <!-- Header -->
        <div class="header">
            <button class="back-button" onclick="history.back()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/>
                    <path d="M14 8l-4 4 4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="header-title">Regularity Measurement</div>
        </div>

        <div class="date-display" id="currentDate"></div>

        <!-- Main Content -->
        <div class="content">
            <h1 class="section-title">Train Number</h1>
            
            <div class="counter-badge" id="trainCounter">Saved Trains: 0</div>

            <!-- 1. حقل رقم القطار -->
            <input 
                type="text" 
                id="trainNumber" 
                class="input-field" 
                placeholder="Enter Train Number" 
                inputmode="numeric" 
                pattern="[0-9]*"
                maxlength="4"
                autocomplete="off"
            />

            <!-- 2. زر وقت الوصول: يظهر تلقائياً بمجرد كتابة رقم القطار -->
            <button class="btn" id="btnArrival" type="button" onclick="handleArrival()">Train Arrival</button>

            <!-- 3. زر وقت المغادرة: يظهر بعد تسجيل وقت الوصول -->
            <button class="btn" id="btnDeparture" type="button" onclick="handleDeparture()">Train Departure</button>

            <!-- 4. زر الحفظ وتنزيل لقطة الشاشة: يظهر بعد تسجيل وقت المغادرة -->
            <button class="btn btn-submit" id="btnSubmit" type="button" onclick="saveRecordAndDownloadScreenshot()">📸 💾 Submit & Screenshot</button>
            
            <!-- 5. زر تصدير ملف TXT لكل القطارات -->
            <button class="btn btn-export" id="btnExport" type="button" onclick="exportAllToTxt()">📥 Download All (TXT File)</button>
            
            <!-- زر إعادة الضبط للبدء من جديد -->
            <button class="btn btn-clear" id="btnClear" type="button" onclick="resetCurrentForm()">Reset Form</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="status-msg" id="statusMessage">Enter train number to start...</div>
            <div>Ver 79</div>
        </div>
    </div>

    <script>
        const today = new Date();
        const formattedDate = (today.getMonth() + 1) + '/' + today.getDate() + '/' + today.getFullYear();
        document.getElementById('currentDate').innerText = formattedDate;

        let arrivalTime = "";
        let departureTime = "";
        
        let savedRecords = [];
        try {
            savedRecords = JSON.parse(localStorage.getItem('train_records') || '[]');
        } catch(e) { savedRecords = []; }
        updateCounter();

        // إظهار زر التصدير إذا كانت هناك قطارات مسجلة مسبقاً
        if (savedRecords.length > 0) {
            document.getElementById('btnExport').style.display = 'block';
        }

        const inputField = document.getElementById('trainNumber');
        const arrivalBtn = document.getElementById('btnArrival');
        const clearBtn = document.getElementById('btnClear');

        // 1. مراقبة الإدخال: إظهار زر Arrival فوراً بمجرد كتابة رقم القطار
        inputField.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
            const val = this.value.trim();
            
            if (val.length > 0) {
                arrivalBtn.style.display = 'block';
                clearBtn.style.display = 'block';
                document.getElementById('statusMessage').innerText = `Train ${val} entered. Tap Train Arrival next.`;
            } else {
                arrivalBtn.style.display = 'none';
                clearBtn.style.display = 'none';
                document.getElementById('statusMessage').innerText = "Enter train number to start...";
            }
        });

        // 2. دالة حساب التوقيت بنظام 24 ساعة (HH:MM:SS)
        function get24HourTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 3. الضغط على Train Arrival: تسجيل الوقت وإظهار زر Train Departure فوراً
        function handleArrival() {
            arrivalTime = get24HourTime();
            arrivalBtn.innerText = "Arrival: " + arrivalTime;
            arrivalBtn.classList.add('recorded');
            
            // إظهار زر المغادرة
            document.getElementById('btnDeparture').style.display = 'block';
            document.getElementById('statusMessage').innerText = `Arrival recorded at ${arrivalTime}. Tap Train Departure next.`;
        }

        // 4. الضغط على Train Departure: تسجيل الوقت وإظهار زر Submit & Screenshot فوراً
        function handleDeparture() {
            departureTime = get24HourTime();
            const depBtn = document.getElementById('btnDeparture');
            depBtn.innerText = "Departure: " + departureTime;
            depBtn.classList.add('recorded');
            
            // إظهار زر الحفظ
            document.getElementById('btnSubmit').style.display = 'block';
            document.getElementById('statusMessage').innerText = `Departure recorded at ${departureTime}. Tap Submit to save.`;
        }

        function updateCounter() {
            document.getElementById('trainCounter').innerText = "Saved Trains: " + savedRecords.length;
        }

        // 5. مسح الحقول وتجهيز الواجهة لتسجيل القطار التالي
        function resetCurrentForm() {
            inputField.value = "";
            inputField.disabled = false;
            arrivalTime = "";
            departureTime = "";
            
            arrivalBtn.innerText = "Train Arrival";
            arrivalBtn.classList.remove('recorded');
            arrivalBtn.style.display = 'none';

            const depBtn = document.getElementById('btnDeparture');
            depBtn.innerText = "Train Departure";
            depBtn.classList.remove('recorded');
            depBtn.style.display = 'none';

            document.getElementById('btnSubmit').style.display = 'none';
            clearBtn.style.display = 'none';

            if (savedRecords.length > 0) {
                document.getElementById('btnExport').style.display = 'block';
            }

            document.getElementById('statusMessage').innerText = "Enter train number to start...";
        }

        // 6. توليد وتنزيل لقطة الشاشة برمجياً كصورة PNG
        function generateAndDownloadImage(trainNo, dateText, arrText, depText) {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 900;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#005a79';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Regularity Measurement', 50, 80);

            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(dateText, canvas.width - 50, 80);

            ctx.textAlign = 'center';
            ctx.font = 'bold 44px sans-serif';
            ctx.fillText('Train Number', canvas.width / 2, 230);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(80, 260, 440, 90, [10]);
            ctx.fill();

            ctx.fillStyle = '#004d66';
            ctx.font = 'bold 50px sans-serif';
            ctx.fillText(trainNo, canvas.width / 2, 325);

            ctx.fillStyle = arrText ? '#e8f5e9' : '#ffffff';
            ctx.beginPath();
            ctx.roundRect(80, 390, 440, 90, [10]);
            ctx.fill();
            if (arrText) {
                ctx.strokeStyle = '#81c784';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            ctx.fillStyle = arrText ? '#1b5e20' : '#004d66';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText(arrText ? 'Arrival: ' + arrText : 'Train Arrival', canvas.width / 2, 448);

            ctx.fillStyle = depText ? '#e8f5e9' : '#ffffff';
            ctx.beginPath();
            ctx.roundRect(80, 520, 440, 90, [10]);
            ctx.fill();
            if (depText) {
                ctx.strokeStyle = '#81c784';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            ctx.fillStyle = depText ? '#1b5e20' : '#004d66';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText(depText ? 'Departure: ' + depText : 'Train Departure', canvas.width / 2, 578);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = '22px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Saved Record', 50, 840);
            ctx.textAlign = 'right';
            ctx.fillText('Ver 79', canvas.width - 50, 840);

            const link = document.createElement('a');
            const timeTag = get24HourTime().replace(/:/g, '-');
            link.download = `Train_${trainNo}_${timeTag}.png`;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 7. حفظ القطار وتنزيل لقطة الشاشة
        function saveRecordAndDownloadScreenshot() {
            const trainNo = inputField.value.trim();

            if (!trainNo) {
                alert("⚠️ Please enter Train Number first!");
                return;
            }

            generateAndDownloadImage(trainNo, formattedDate, arrivalTime, departureTime);

            const newRecord = {
                date: formattedDate,
                trainNumber: trainNo,
                arrival: arrivalTime || "N/A",
                departure: departureTime || "N/A",
                timestamp: get24HourTime()
            };

            savedRecords.push(newRecord);
            try {
                localStorage.setItem('train_records', JSON.stringify(savedRecords));
            } catch(e) {}
            
            updateCounter();
            alert(`✅ Train ${trainNo} saved & Screenshot downloaded! Total: ${savedRecords.length}`);
            resetCurrentForm();
        }

        // 8. تصدير وتنزيل ملف TXT لكل القطارات
        function exportAllToTxt() {
            if (savedRecords.length === 0) {
                alert("⚠️ No saved trains to download yet!");
                return;
            }

            let fileContent = "========================================\n";
            fileContent += "      REGULARITY MEASUREMENT REPORT      \n";
            fileContent += `      Date: ${formattedDate} | Total Trains: ${savedRecords.length}\n`;
            fileContent += "========================================\n\n";
            fileContent += "Train No | Date       | Arrival  | Departure\n";
            fileContent += "----------------------------------------\n";

            savedRecords.forEach((item) => {
                const trainFormatted = item.trainNumber.padEnd(8, ' ');
                const dateFormatted = item.date.padEnd(10, ' ');
                const arrFormatted = item.arrival.padEnd(8, ' ');
                const depFormatted = item.departure.padEnd(8, ' ');
                fileContent += `${trainFormatted} | ${dateFormatted} | ${arrFormatted} | ${depFormatted}\n`;
            });

            fileContent += "\n========================================\n";

            const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            const fileName = `Regularity_${formattedDate.replace(/\//g, '-')}_AllTrains.txt`;
            
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            if (confirm("✅ TXT file downloaded successfully!\n\nDo you want to clear the saved trains list to start a new shift?")) {
                savedRecords = [];
                localStorage.removeItem('train_records');
                updateCounter();
